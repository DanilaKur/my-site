<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой дашборд</title>
<style>
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent2: #22c55e;
    --danger: #ef4444;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel2: #eef0f4;
    --border: #d5d8e0;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent2: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
    transition: background .2s, color .2s;
  }
  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 600;
  }
  .header-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tabs {
    display: flex;
    gap: 6px;
    flex: 1;
    flex-wrap: wrap;
  }
  .header-actions {
    display: flex;
    gap: 6px;
  }
  .tab {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: .15s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  input, select, button, textarea {
    font-family: inherit;
    font-size: 14px;
  }
  input, select, textarea {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .row > * { flex: 1; min-width: 120px; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:hover { opacity: .9; }
  .btn.ghost {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 5px 9px; font-size: 12px; }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar input { flex: 1; }

  .category-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 20px 0 8px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }
  .link-card a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-card a:hover { color: var(--accent); }
  .link-card .url {
    font-size: 12px;
    color: var(--muted);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-card .actions { display: flex; gap: 4px; }

  .clip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  .clip-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: .15s;
    position: relative;
    overflow: hidden;
  }
  .clip-btn:hover { border-color: var(--accent); }
  .clip-btn.copied {
    border-color: var(--accent2);
    background: rgba(34,197,94,.1);
  }
  .clip-btn .label {
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
  }
  .clip-btn .value {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }
  .clip-btn .copied-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 11px;
    color: var(--accent2);
    opacity: 0;
    transition: .2s;
  }
  .clip-btn.copied .copied-badge { opacity: 1; }
  .clip-actions {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    justify-content: flex-end;
  }

  /* ============ БЛОКИ ============ */
  .block-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .block-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .block-title {
    font-weight: 600;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .block-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .block-body { font-size: 14px; }
  .block-body .btn { padding: 7px 12px; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent2);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    transition: .25s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  details.add-form {
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  details.add-form summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    user-select: none;
  }
  details.add-form[open] summary { margin-bottom: 12px; }

  @media (max-width: 500px) {
    .link-card .actions { flex-direction: column; }
    main { padding: 12px; }
    .header-actions { width: 100%; }
    .header-actions .btn { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>🧰 Мой дашборд</h1>
  <div class="header-row">
    <div class="tabs">
      <button class="tab active" data-tab="links">Ссылки</button>
      <button class="tab" data-tab="clips">Быстрый буфер</button>
      <button class="tab" data-tab="blocks">Блоки</button>
    </div>
    <div class="header-actions">
      <button class="btn small ghost" id="themeToggle" title="Переключить тему">🌙</button>
      <button class="btn small ghost" id="exportAll" title="Скачать dashboard.json">⬇ Экспорт</button>
      <button class="btn small ghost" id="importAll" title="Загрузить dashboard.json">⬆ Импорт</button>
      <input type="file" id="importAllFile" accept=".json" hidden>
    </div>
  </div>
</header>

<main>

  <!-- ================= ССЫЛКИ ================= -->
  <section class="panel active" id="panel-links">
    <div class="toolbar">
      <input type="search" id="search" placeholder="🔍 Поиск по ссылкам...">
    </div>
    <details class="add-form">
      <summary>➕ Добавить ссылку</summary>
      <div class="row">
        <input type="text" id="linkTitle" placeholder="Название">
        <input type="text" id="linkUrl" placeholder="https://...">
      </div>
      <div class="row">
        <input type="text" id="linkCat" placeholder="Категория" list="catList">
        <datalist id="catList"></datalist>
        <button class="btn" id="addLink">Добавить</button>
      </div>
    </details>
    <div id="linksList"></div>
  </section>

  <!-- ================= БУФЕР ================= -->
  <section class="panel" id="panel-clips">
    <details class="add-form">
      <summary>➕ Добавить в буфер</summary>
      <div class="row">
        <input type="text" id="clipLabel" placeholder="Название">
      </div>
      <div class="row">
        <input type="text" id="clipValue" placeholder="Значение">
        <button class="btn" id="addClip">Добавить</button>
      </div>
    </details>
    <div class="clip-grid" id="clipsList"></div>
  </section>

  <!-- ================= БЛОКИ ================= -->
  <section class="panel" id="panel-blocks">
    <details class="add-form">
      <summary>➕ Добавить блок</summary>
      <div class="row">
        <input type="text" id="blockName" placeholder="Название блока">
      </div>
      <div style="margin-bottom:12px">
        <textarea id="blockCode" placeholder="// Код получает переменную el — DOM-контейнер блока
// Пример:
el.innerHTML = '&lt;button class=&quot;btn&quot;&gt;Привет&lt;/button&gt;';
el.querySelector('button').onclick = () =&gt; alert('Работает!');"></textarea>
      </div>
      <div class="row">
        <button class="btn" id="addBlock">Добавить блок</button>
      </div>
    </details>
    <div id="blocksList"></div>
  </section>

</main>

<div class="toast" id="toast">Скопировано</div>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const toast = (msg) => {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 1500);
  };

  const load = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  };
  const save = (key, val) => localStorage.setItem(key, JSON.stringify(val));

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta); return ok;
    }
  }

  // ================== ТЕМА ==================
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $("#themeToggle").textContent = theme === "dark" ? "🌙" : "☀️";
  }
  let currentTheme = localStorage.getItem("dashboard.theme") || "dark";
  applyTheme(currentTheme);
  $("#themeToggle").onclick = () => {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    localStorage.setItem("dashboard.theme", currentTheme);
    applyTheme(currentTheme);
  };

  // ================== ВКЛАДКИ ==================
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");
      $("#panel-" + tab.dataset.tab).classList.add("active");
    });
  });

  // ================== ССЫЛКИ ==================
  let links = load("dashboard.links", []);

  function renderLinks() {
    const q = $("#search").value.trim().toLowerCase();
    const list = $("#linksList");
    const datalist = $("#catList");

    const cats = [...new Set(links.map((l) => l.category).filter(Boolean))].sort();
    datalist.innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">`).join("");

    const filtered = q
      ? links.filter((l) =>
          (l.title + " " + l.url + " " + (l.category || "")).toLowerCase().includes(q))
      : links;

    if (!filtered.length) {
      list.innerHTML = `<div class="empty">${q ? "Ничего не найдено" : "Пока нет ссылок"}</div>`;
      return;
    }

    const groups = {};
    filtered.forEach((l) => {
      const c = l.category || "Без категории";
      (groups[c] ||= []).push(l);
    });

    let html = "";
    Object.keys(groups).sort().forEach((cat) => {
      html += `<div class="category-title">${escapeHtml(cat)}</div>`;
      groups[cat].forEach((l) => {
        html += `
          <div class="link-card">
            <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">
              ${escapeHtml(l.title)}
              <span class="url">${escapeHtml(l.url)}</span>
            </a>
            <div class="actions">
              <button class="btn small ghost" data-copy="${l.id}" title="Скопировать ссылку">🔗</button>
              <button class="btn small danger" data-del="${l.id}" title="Удалить">✕</button>
            </div>
          </div>`;
      });
    });
    list.innerHTML = html;

    list.querySelectorAll("[data-del]").forEach((b) => {
      b.onclick = () => {
        if (!confirm("Удалить ссылку?")) return;
        links = links.filter((l) => l.id !== b.dataset.del);
        save("dashboard.links", links); renderLinks();
      };
    });
    list.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = async () => {
        const l = links.find((x) => x.id === b.dataset.copy);
        if (!l) return;
        (await copyText(l.url)) ? toast("Ссылка скопирована") : toast("Не удалось скопировать");
      };
    });
  }

  $("#search").addEventListener("input", renderLinks);
  $("#addLink").onclick = () => {
    const title = $("#linkTitle").value.trim();
    let url = $("#linkUrl").value.trim();
    const category = $("#linkCat").value.trim();
    if (!title || !url) return toast("Заполни название и URL");
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    links.push({ id: uid(), title, url, category });
    save("dashboard.links", links);
    $("#linkTitle").value = $("#linkUrl").value = "";
    renderLinks(); toast("Ссылка добавлена");
  };

  // ================== БУФЕР ==================
  let clips = load("dashboard.clips", []);

  function renderClips() {
    const grid = $("#clipsList");
    if (!clips.length) { grid.innerHTML = `<div class="empty">Пока пусто</div>`; return; }
    grid.innerHTML = clips.map((c) => `
      <div class="clip-btn" data-id="${c.id}">
        <span class="label">${escapeHtml(c.label)}</span>
        <span class="value">${escapeHtml(c.value)}</span>
        <span class="copied-badge">✓ скопировано</span>
        <div class="clip-actions">
          <button class="btn small ghost" data-edit="${c.id}" title="Редактировать">✎</button>
          <button class="btn small danger" data-del="${c.id}" title="Удалить">✕</button>
        </div>
      </div>
    `).join("");

    grid.querySelectorAll(".clip-btn").forEach((btn) => {
      btn.onclick = async (e) => {
        if (e.target.closest("[data-edit],[data-del]")) return;
        const c = clips.find((x) => x.id === btn.dataset.id);
        if (!c) return;
        const ok = await copyText(c.value);
        if (ok) {
          btn.classList.add("copied");
          setTimeout(() => btn.classList.remove("copied"), 1200);
          toast("Скопировано: " + c.label);
        } else toast("Не удалось скопировать");
      };
    });
    grid.querySelectorAll("[data-del]").forEach((b) => {
      b.onclick = (e) => {
        e.stopPropagation();
        if (!confirm("Удалить кнопку?")) return;
        clips = clips.filter((c) => c.id !== b.dataset.del);
        save("dashboard.clips", clips); renderClips();
      };
    });
    grid.querySelectorAll("[data-edit]").forEach((b) => {
      b.onclick = (e) => {
        e.stopPropagation();
        const c = clips.find((x) => x.id === b.dataset.edit);
        if (!c) return;
        const newLabel = prompt("Название:", c.label); if (newLabel === null) return;
        const newValue = prompt("Значение:", c.value); if (newValue === null) return;
        c.label = newLabel.trim() || c.label;
        c.value = newValue;
        save("dashboard.clips", clips); renderClips();
      };
    });
  }

  $("#addClip").onclick = () => {
    const label = $("#clipLabel").value.trim();
    const value = $("#clipValue").value;
    if (!label || !value) return toast("Заполни название и значение");
    clips.push({ id: uid(), label, value });
    save("dashboard.clips", clips);
    $("#clipLabel").value = $("#clipValue").value = "";
    renderClips(); toast("Кнопка добавлена");
  };

  // ================== БЛОКИ ==================
  let blocks = load("dashboard.blocks", []);

  function runBlock(container, code) {
    container.innerHTML = "";
    try {
      const fn = new Function("el", code);
      fn(container);
    } catch (e) {
      container.innerHTML = `<div style="color:var(--danger);font-size:13px">Ошибка блока: ${escapeHtml(e.message)}</div>`;
    }
  }

  function renderBlocks() {
    const wrap = $("#blocksList");
    if (!blocks.length) {
      wrap.innerHTML = `<div class="empty">Пока нет блоков</div>`;
      return;
    }
    wrap.innerHTML = blocks.map((b) => `
      <div class="block-card" data-id="${b.id}">
        <div class="block-head">
          <span class="block-title">${escapeHtml(b.name)}</span>
          <div class="block-actions">
            <button class="btn small ghost" data-reload="${b.id}" title="Перезапустить">↻</button>
            <button class="btn small ghost" data-edit="${b.id}" title="Изменить">✎</button>
            <button class="btn small danger" data-del="${b.id}" title="Удалить">✕</button>
          </div>
        </div>
        <div class="block-body" id="block-body-${b.id}"></div>
      </div>
    `).join("");

    blocks.forEach((b) => {
      const container = document.getElementById("block-body-" + b.id);
      if (container) runBlock(container, b.code);
    });

    wrap.querySelectorAll("[data-reload]").forEach((btn) => {
      btn.onclick = () => {
        const b = blocks.find((x) => x.id === btn.dataset.reload);
        if (!b) return;
        const container = document.getElementById("block-body-" + b.id);
        if (container) runBlock(container, b.code);
      };
    });
    wrap.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.onclick = () => {
        const b = blocks.find((x) => x.id === btn.dataset.edit);
        if (!b) return;
        const newName = prompt("Название:", b.name);
        if (newName === null) return;
        const newCode = prompt("Код блока:", b.code);
        if (newCode === null) return;
        b.name = newName.trim() || b.name;
        b.code = newCode;
        save("dashboard.blocks", blocks);
        renderBlocks();
      };
    });
    wrap.querySelectorAll("[data-del]").forEach((btn) => {
      btn.onclick = () => {
        if (!confirm("Удалить блок?")) return;
        blocks = blocks.filter((x) => x.id !== btn.dataset.del);
        save("dashboard.blocks", blocks);
        renderBlocks();
      };
    });
  }

  $("#addBlock").onclick = () => {
    const name = $("#blockName").value.trim();
    const code = $("#blockCode").value;
    if (!name || !code.trim()) return toast("Заполни название и код");
    blocks.push({ id: uid(), name, code });
    save("dashboard.blocks", blocks);
    $("#blockName").value = "";
    $("#blockCode").value = "";
    renderBlocks();
    toast("Блок добавлен");
  };

  // ================== ЭКСПОРТ / ИМПОРТ ==================
  const download = (data, filename) => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  $("#exportAll").onclick = () => {
    download({
      version: 2,
      exportedAt: new Date().toISOString(),
      links, clips, blocks,
    }, "dashboard.json");
    toast("Экспортировано");
  };

  $("#importAll").onclick = () => $("#importAllFile").click();

  $("#importAllFile").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        let iL = 0, iC = 0, iB = 0;

        if (data && typeof data === "object" && !Array.isArray(data)) {
          if (Array.isArray(data.links)) {
            links = data.links.map((l) => ({ id: l.id || uid(), ...l }));
            save("dashboard.links", links); renderLinks(); iL = data.links.length;
          }
          if (Array.isArray(data.clips)) {
            clips = data.clips.map((c) => ({ id: c.id || uid(), ...c }));
            save("dashboard.clips", clips); renderClips(); iC = data.clips.length;
          }
          if (Array.isArray(data.blocks)) {
            blocks = data.blocks.map((b) => ({ id: b.id || uid(), name: b.name || 'Блок', code: b.code || '' }));
            save("dashboard.blocks", blocks); renderBlocks(); iB = data.blocks.length;
          }
        } else if (Array.isArray(data)) {
          const first = data[0] || {};
          if ("url" in first || "title" in first) {
            links = data.map((l) => ({ id: l.id || uid(), ...l }));
            save("dashboard.links", links); renderLinks(); iL = data.length;
          } else if ("value" in first || "label" in first) {
            clips = data.map((c) => ({ id: c.id || uid(), ...c }));
            save("dashboard.clips", clips); renderClips(); iC = data.length;
          } else {
            throw new Error("unknown structure");
          }
        } else throw new Error("unknown format");

        if (iL || iC || iB) {
          const parts = [];
          if (iL) parts.push("ссылок: " + iL);
          if (iC) parts.push("буфера: " + iC);
          if (iB) parts.push("блоков: " + iB);
          toast("Импортировано " + parts.join(", "));
        } else toast("Нечего импортировать");
      } catch { toast("Ошибка чтения файла"); }
    };
    r.readAsText(f);
    e.target.value = "";
  };

  // ================== СТАРТ ==================
  renderLinks();
  renderClips();
  renderBlocks();
})();
</script>
</body>
</html>
